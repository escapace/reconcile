name = "Reconcile"
version = "0.0.0"
defaultTargets = [
  "Reconcile",
  "reconcile-oracle"
]

[leanOptions]
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

pp.unicode.fun = true

weak.linter.mathlibStandardSet = true

weak.linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "Reconcile"
srcDir = "lean"
roots = [
  "Defs",
  "WF",
  "SnapshotSpec",
  "SnapshotSoundness",
  "SnapshotProjection",
  "SnapshotStream",
  "SnapshotOwner",
  "Publication",
  "PropertyOrder",
  "PropertyOrderOracle",
  "GraphPolicy",
  "Execution",
  "IncomingConsensus",
  "ActiveDemands",
  "SelectionUnwind",
  "SelectionUnwindOracle",
  "ForwardDemands",
  "ForcedGroups",
  "FiniteReachability",
  "ForcedGroupsReference",
  "SupportedChoices",
  "DenseChecks",
  "Claims",
  "Construction",
  "ConstructionFrontier",
  "ConstructionIncidence",
  "ConstructionAdmission",
  "ConstructionCompletion",
  "ConstructionSetup",
  "ConstructionLevels",
  "ConstructionBuckets",
  "ConstructionRankUpdates",
  "ConstructionScheduler",
  "Types.Cell",
  "Types.Recognition",
  "Driver",
  "Requirements",
  "RequirementAdmission",
  "RequirementPropagation",
  "SeededRequirements",
  "SeededRequirementsOracle",
  "ClosureHistory",
  "DeferredOrder",
  "DeferredOrderOracle",
  "FactRenaming",
  "FactRenamingOracle",
  "Provenance",
  "PolicyOracle",
  "ReuseClosure",
  "Immutable",
  "ImmutableLabels",
  "CompactImmutable",
  "CompactOwners",
  "CompactImmutableOracle",
  "ContractTest",
  "ContractOracle",
  "RuntimeOracle",
  "OracleMain",
  "ReconcileSpec",
  "ReconcileSoundness",
  "PrunedReconcile",
  "PrunedOracle",
  "ProduceDefs",
  "ProduceSpec",
  "ProduceSoundness",
  "ProduceFinalizeCoherence",
  "ProduceFinalizeCoherenceSoundness",
  "RecipePublicationSpec",
  "RecipePublicationSoundness",
  "RecipePublicationOrder",
  "RecipePublicationLocality",
