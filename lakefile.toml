  "Oracle.SerializationOracle",
  "Serialization.Size",
  "Heap.Defs",
  "Heap.WF",
  "Heap.Publication",
  "Property.PropertyOrder",
  "Oracle.PropertyOrderOracle",
  "Property.PropertyWrite",
  "Oracle.PropertyWriteOracle",
  "Property.PropertyPlacement",
  "Oracle.PropertyPlacementOracle",
  "Property.KeyOrder",
  "Oracle.KeyOrderOracle",
  "Produce.DraftSurface",
  "Oracle.DraftSurfaceOracle",
  "Produce.DraftClass",
  "Oracle.DraftClassOracle",
  "Produce.DraftIteration",
  "Oracle.DraftIterationOracle",
